kind = "web"
previewPath = "/"
title = "Career Compass"
description = "A focused career opportunity organizer for college students to track internships, research, scholarships, networking events, deadlines, statuses, next steps, and notes in one calm workspace."
version = "1.0.0"
id = "artifacts/career-compass"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20493

[services.development]
run = "pnpm --filter @workspace/career-compass run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-compass", "run", "build" ]
serve = "static"
publicDir = "artifacts/career-compass/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20493"
BASE_PATH = "/"
